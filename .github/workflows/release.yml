name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.1.0"
        required: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the .toc version
        run: |
          version="${TAG#v}"
          grep -qx "## Version: ${version}" ClaiibuAPI/ClaiibuAPI.toc \
            || { echo "Tag ${TAG} does not match ## Version in ClaiibuAPI/ClaiibuAPI.toc"; exit 1; }

      - name: Check the Lua compiles (Lua 5.1)
        run: |
          sudo apt-get install -y lua5.1 >/dev/null
          find ClaiibuAPI ClaiibuAPIDemo -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Build the addon zip
        run: |
          mkdir -p dist
          cp -r ClaiibuAPI ClaiibuAPIDemo dist/
          cp README.md AI_PROMPT.md AI_GUIDE.md dist/ClaiibuAPI/
          cd dist && zip -r "ClaiibuAPI-${TAG}.zip" ClaiibuAPI ClaiibuAPIDemo

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # On a manual run the tag does not exist yet; --target creates it here.
          gh release create "$TAG" "dist/ClaiibuAPI-${TAG}.zip" \
            --target "$GITHUB_SHA" \
            --title "ClaiibuAPI ${TAG}" \
            --prerelease \
            --notes "ClaiibuAPI, a dependency addon for WoW: Forever (## Interface: 16001), plus ClaiibuAPIDemo. Not yet tested in-game; run /capi probe on your build.

          Unzip into World of Warcraft\\_classic_beta_\\Interface\\AddOns\\ so you have AddOns\\ClaiibuAPI\\ and AddOns\\ClaiibuAPIDemo\\. Players need ClaiibuAPI plus the addons that use it; the demo is optional. Restart the client if an addon does not appear.

          Addons use it with ## Dependencies: ClaiibuAPI. See README.md, AI_PROMPT.md and AI_GUIDE.md inside the ClaiibuAPI folder."
